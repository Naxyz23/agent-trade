# .github/workflows/stock.yml
name: stock-signals

on:
  schedule:
    - cron: "10 6 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self-test
        run: python tests/test_engine.py
      - name: Run scanner (stock)
        run: python -m engine.run --group stock
      - name: Commit results
        run: |
          git config user.name  "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/signals_stock.json data/state_stock.json
          git diff --staged --quiet || git commit -m "stock signals $(date -u +%F_%H:%M)"
          git pull --rebase --autostash || true
          git push
      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        run: python -m engine.notify --group stock
      - name: Upload brief
        if: always()
        run: python -m engine.render data/signals_stock.json data/brief_stock.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-stock
          path: data/brief_stock.html
          retention-days: 14
