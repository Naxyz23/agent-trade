# .github/workflows/crypto.yml
name: crypto-signals

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crypto-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self-test
        run: python tests/test_engine.py
      - name: Run scanner (crypto)
        run: python -m engine.run --group crypto
      - name: Commit results
        run: |
          git config user.name  "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/signals_crypto.json data/state_crypto.json
          git diff --staged --quiet || git commit -m "crypto signals $(date -u +%F_%H:%M)"
          git pull --rebase --autostash || true
          git push
      - name: Notify Discord
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -m engine.notify --group crypto
      - name: Upload brief
        if: always()
        run: python -m engine.render data/signals_crypto.json data/brief_crypto.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-crypto
          path: data/brief_crypto.html
          retention-days: 14
