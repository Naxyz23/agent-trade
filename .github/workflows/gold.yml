# .github/workflows/gold.yml
name: gold-signals

on:
  schedule:
    # 13:10 น. ไทย อังคาร-เสาร์ — หลังตลาด NY ปิด
    - cron: "10 6 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

# v0.6: ทั้ง 3 workflow ใช้ concurrency group เดียวกัน
# ของเดิม gold กับ stock ตั้ง cron ชนกันเป๊ะ (10 6) แต่คนละ group จึงรันพร้อมกัน
# แล้ว git push ชนกัน — ตัวที่แพ้จะ push ไม่ขึ้นและผลรอบนั้นหายเงียบ ๆ
# ตอนนี้ทั้งเวลาและ concurrency แยกกันแล้ว และมี retry loop ซ้อนอีกชั้น
concurrency:
  group: agent-trade-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Self-test
        run: python tests/test_engine.py

      - name: Run scanner (gold)
        run: python -m engine.run --group gold

      - name: Render brief
        if: always()
        run: python -m engine.render data/signals_gold.json data/brief_gold.html

      - name: Commit results (retry on push race)
        run: |
          set -e
          git config user.name  "signal-bot"
          git config user.email "bot@users.noreply.github.com"

          # ไฟล์ค้างจาก v0.4 — ไม่มีอะไรเขียนทับแล้ว ถ้าใครอ่านผิดไฟล์จะได้ข้อมูลแช่แข็ง
          git rm -f --ignore-unmatch data/signals.json data/state.json || true

          git add -A data/
          if git diff --staged --quiet; then
            echo "ไม่มีอะไรเปลี่ยน — ข้ามการ commit"
            exit 0
          fi
          git commit -m "gold signals $(date -u +%F_%H:%M)"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "push สำเร็จรอบที่ $i"
              exit 0
            fi
            echo "push ชนกับ job อื่น — รอแล้วลองใหม่ (รอบที่ $i)"
            sleep $(( 5 + RANDOM % 15 ))
          done
          echo "::error::push ไม่สำเร็จหลังลอง 5 รอบ — ผลรอบนี้ยังไม่ขึ้น repo"
          exit 1

      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        run: python -m engine.notify --group gold

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-gold
          path: data/brief_gold.html
          retention-days: 14
