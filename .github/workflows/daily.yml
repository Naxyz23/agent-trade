name: daily-signals

# 06:10 UTC = 13:10 ไทย  → หลังตลาด US ปิดและข้อมูลนิ่งแล้ว
# 21:10 UTC = 04:10 ไทย  → รอบเช็ค crypto/ทอง ก่อนตลาด US เปิด
on:
  schedule:
    - cron: "10 6 * * 2-6"
    - cron: "10 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scanner
        run: python -m engine.run

      - name: Commit results
        run: |
          git config user.name  "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/signals.json data/state.json
          git diff --staged --quiet || git commit -m "signals $(date -u +%F_%H:%M)"
          git push
