# Watchlist — แก้ไฟล์นี้ไฟล์เดียวพอ ไม่ต้องแตะโค้ด
#
# sources:  ไล่จากซ้ายไปขวา ใช้อันแรกที่ให้ข้อมูล "สดพอ" (ดู max_bar_age_days)
#           ถ้าอันแรกล้มหรือคืนกราฟเก่าเกินเกณฑ์ จะข้ามไปอันถัดไปเอง
#           แต่ละแหล่งคืนประวัติทั้งชุดของมันเอง — ไม่มีการต่อข้อมูลข้ามแหล่งกลางคัน
# kraken:   ปิดแท่ง Daily 00:00 UTC แล้วดึงได้ทันที → เป็นตัวหลักของ crypto ตั้งแต่ v0.6
#           (Yahoo ปล่อยแท่ง crypto ช้า 17 ส.ค. 2026 รันตอน 01:55 UTC ได้กราฟของวันที่ 15)
# yahoo:    ตัวหลักของหุ้น/ทอง และตัวสำรองของ crypto — Kraken ไม่มี BNB จึงใช้ yahoo ล้วน
# leverage_cap: x5 ทุกสินทรัพย์ ตาม cngoal v5.1 Machine Spec
#               หุ้น US เทรดผ่าน margin/CFD จึงชอร์ตได้และใช้ x5 เท่ากัน
# long_only:    ไม่ตั้ง = เข้าได้ทั้ง long และ short (ค่าเริ่มต้น)

assets:
  # ---------------- Crypto (Binance Futures — leverage x5) ----------------
  - { symbol: BTC, class: crypto, name: "Bitcoin",  leverage_cap: 5,
      sources: [kraken, yahoo], fetch_symbol_kraken: "XBTUSD", fetch_symbol: "BTC-USD" }
  - { symbol: ETH, class: crypto, name: "Ethereum", leverage_cap: 5,
      sources: [kraken, yahoo], fetch_symbol_kraken: "ETHUSD", fetch_symbol: "ETH-USD" }
  - { symbol: SOL, class: crypto, name: "Solana",   leverage_cap: 5,
      sources: [kraken, yahoo], fetch_symbol_kraken: "SOLUSD", fetch_symbol: "SOL-USD" }
  # BNB ไม่มีคู่ USD บน Kraken — ต้องพึ่ง Yahoo อย่างเดียว จึงเผื่ออายุกราฟไว้มากกว่าเพื่อน
  - { symbol: BNB, class: crypto, name: "BNB",      leverage_cap: 5,
      sources: [yahoo], fetch_symbol: "BNB-USD", max_bar_age_days: 3 }

  # ---------------- ทองคำ ----------------
  # ห้ามใส่ PAXGUSD เป็น fallback ของ XAU — คนละสินทรัพย์ ราคาไม่เท่ากัน
  # ถ้าสลับแหล่งกันไปมา EMA200/RSI จะกระโดดโดยไม่มีอะไรเกิดขึ้นบนกราฟจริง
  - { symbol: XAU, class: metal, name: "Gold Futures", leverage_cap: 5,
      sources: [yahoo], fetch_symbol: "GC=F" }

  # ---------------- หุ้น US (margin/CFD — ชอร์ตได้ leverage x5) ----------------
  - { symbol: NVDA, fetch_symbol: "NVDA", class: stock, name: "NVIDIA",           leverage_cap: 5 }
  - { symbol: MSFT, fetch_symbol: "MSFT", class: stock, name: "Microsoft",        leverage_cap: 5 }
  - { symbol: AAPL, fetch_symbol: "AAPL", class: stock, name: "Apple",            leverage_cap: 5 }
  - { symbol: GOOG, fetch_symbol: "GOOG", class: stock, name: "Alphabet C",       leverage_cap: 5 }
  - { symbol: META, fetch_symbol: "META", class: stock, name: "Meta Platforms",   leverage_cap: 5 }
  - { symbol: AMD,  fetch_symbol: "AMD",  class: stock, name: "AMD",              leverage_cap: 5 }
  - { symbol: TSM,  fetch_symbol: "TSM",  class: stock, name: "TSMC ADR",         leverage_cap: 5 }
  - { symbol: TSLA, fetch_symbol: "TSLA", class: stock, name: "Tesla",            leverage_cap: 5 }
  - { symbol: ORCL, fetch_symbol: "ORCL", class: stock, name: "Oracle",           leverage_cap: 5 }
  - { symbol: NFLX, fetch_symbol: "NFLX", class: stock, name: "Netflix",          leverage_cap: 5 }
  - { symbol: JPM,  fetch_symbol: "JPM",  class: stock, name: "JPMorgan Chase",   leverage_cap: 5 }
  - { symbol: LLY,  fetch_symbol: "LLY",  class: stock, name: "Eli Lilly",        leverage_cap: 5 }
  - { symbol: WMT,  fetch_symbol: "WMT",  class: stock, name: "Walmart",          leverage_cap: 5 }

  # SPCX (SpaceX) — IPO 12 มิ.ย. 2026 มีข้อมูลแค่ ~46 แท่ง
  # ต้องมี 221 แท่งถึงคำนวณ EMA200 + slope ได้ → เปิดใช้ได้ราวเดือน เม.ย. 2027
  # - { symbol: SPCX, fetch_symbol: "SPCX", class: stock, name: "SpaceX", leverage_cap: 5 }

  # ---------------- บริบทตลาด (ไม่ส่งสัญญาณเข้า ใช้ดูภาพรวมอย่างเดียว) ----------------
  - { symbol: SPY, fetch_symbol: "SPY",      class: context, name: "S&P 500 ETF",     signals: false }
  - { symbol: QQQ, fetch_symbol: "QQQ",      class: context, name: "Nasdaq 100 ETF",  signals: false }
  - { symbol: DXY, fetch_symbol: "DX-Y.NYB", class: context, name: "US Dollar Index", signals: false }

# ---------------- Risk (ตรงกับ CNgoal v5.1 Machine Spec) ----------------
# ยอดพอร์ตอยู่ใน data/portfolio.json ก้อนเดียว ใช้ร่วมกันทั้ง 3 agent
# เพราะกฎ drawdown 15% ของ v5.1 พูดถึงพอร์ตทั้งก้อน ถ้าแยกตาม agent ตัวเลขจะไร้ความหมาย
# ส่วนไม้ที่เปิดอยู่ + consecutive_losses ยังแยกตาม agent เหมือนเดิม
# (ผลเทรด crypto ไม่ควรทำให้ agent หุ้นพักตาม — คนละพฤติกรรมตลาด)
risk:
  spec_version: "cngoal-5.1"
  pct_per_trade: 1.0          # v0.6 อ่านค่านี้จริงแล้ว (ก่อนหน้านี้ rules.py hardcode ทิ้งไว้)
  default_leverage_cap: 5
  equity_usdt: 100            # ใช้เป็นยอดตั้งต้นครั้งแรกเท่านั้น หลังจากนั้นดู portfolio.json
  pause_after_losses: 3       # แพ้ติด 3 ไม้ (เฉพาะสายนั้น) → พัก
  pause_days: 3               # พักกี่วัน — ครบแล้วกลับมาเทรดเองอัตโนมัติ
  halt_drawdown_pct: 15       # พอร์ตลดจาก peak 15% → หยุด ปลดล็อกด้วยมือใน manual.json
  max_concurrent_positions: 1 # ต่อ agent — 3 agent x 1 = risk รวมไม่เกิน 3% พร้อมกัน
  max_gap_loss_r: 5           # ขาดทุนเกินกี่เท่าของ SL ที่วางไว้ ถึงจะถือว่า "ข้อมูลเพี้ยน"
                              # ไม่ใช่ตลาดพังจริง (split / สลับแหล่งข้อมูล / feed เสีย)
                              # แล้วบันทึกผลที่ราคา stop ตามแผนแทน พร้อมเตือนให้ไปเช็ค

filters:
  include_watch: true         # ส่งสัญญาณ watch (3/4 ข้อ, ผันผวน) ด้วยไหม
  max_watch_per_run: 6        # สัญญาณ entry/exit ส่งครบเสมอ อันนี้จำกัดแค่ watch

# ---------------- แจ้งเตือน Discord ----------------
notify:
  on_empty: false   # false = ส่งเฉพาะวันที่มี entry/exit/halt/error จริง
                    # true  = ส่งทุกรอบแม้ไม่มีอะไร (จะได้ ~60 ข้อความ/เดือน แล้วจะเลิกอ่าน)
